<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WJ Medical Learning</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap');
  :root {
    --ink:#1a1a2e; --ink-light:#4a4a6a; --ink-faint:#9090b0;
    --paper:#f5f3ee; --paper-warm:#ede9e0; --paper-card:#faf9f6;
    --accent:#8b4513; --accent-light:#c4734a; --accent-pale:#f0e4d8;
    --green:#2d6a4f; --green-pale:#d8f3dc;
    --amber:#b5650d; --amber-pale:#fef3e2;
    --red:#9b2335; --red-pale:#fde8ec;
    --border:#d8d4c8; --shadow:rgba(26,26,46,0.08);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Noto Sans JP',sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; font-size:14px; line-height:1.7; }
  #app { display:flex; min-height:100vh; }
  #sidebar { width:240px; min-width:240px; background:var(--ink); color:#ccc; display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; overflow-y:auto; z-index:100; }
  #sidebar-header { padding:22px 18px 14px; border-bottom:1px solid rgba(255,255,255,0.08); cursor:pointer; }
  #sidebar-header h1 { font-family:'Noto Serif JP',serif; font-size:13px; font-weight:700; color:#fff; letter-spacing:0.04em; }
  #sidebar-header p { font-size:10px; color:#555; margin-top:3px; font-family:'DM Mono',monospace; }
  .sb-label { font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#555; padding:14px 18px 5px; font-family:'DM Mono',monospace; }
  .sb-cat { display:flex; align-items:center; gap:8px; padding:8px 18px; cursor:pointer; font-size:12px; color:#aaa; transition:background 0.15s, color 0.15s; }
  .sb-cat:hover { background:rgba(255,255,255,0.06); color:#fff; }
  .sb-cat.active { color:#fff; background:rgba(255,255,255,0.05); }
  .sb-cat-num { font-family:'DM Mono',monospace; font-size:11px; color:#c4734a; min-width:28px; flex-shrink:0; }
  #main { margin-left:240px; flex:1; display:flex; flex-direction:column; }
  #topnav { background:var(--paper-card); border-bottom:1px solid var(--border); padding:0 28px; height:50px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:50; }
  #nav-home-btn { font-size:12px; color:var(--accent); cursor:pointer; background:none; border:none; font-family:inherit; padding:4px 8px; border-radius:4px; transition:background 0.15s; }
  #nav-home-btn:hover { background:var(--accent-pale); }
  #breadcrumb { font-size:11px; color:var(--ink-faint); font-family:'DM Mono',monospace; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #breadcrumb span { color:var(--ink-light); }
  .page { display:none; padding:32px 36px; max-width:960px; }
  .page.active { display:block; }
  /* HOME */
  .home-title { font-family:'Noto Serif JP',serif; font-size:22px; font-weight:300; color:var(--ink); margin-bottom:4px; letter-spacing:0.06em; }
  .home-date { font-family:'DM Mono',monospace; font-size:11px; color:var(--ink-faint); margin-bottom:28px; }
  .home-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
  .home-card { background:var(--paper-card); border:1px solid var(--border); border-radius:8px; padding:18px 22px; }
  .home-card-title { font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px; font-family:'DM Mono',monospace; }
  .home-stat { font-family:'Noto Serif JP',serif; font-size:32px; font-weight:300; color:var(--ink); line-height:1; }
  .home-stat-sub { font-size:11px; color:var(--ink-faint); margin-top:4px; }
  .review-section { background:var(--paper-card); border:1px solid var(--border); border-radius:8px; padding:20px 22px; margin-bottom:24px; }
  .review-title { font-family:'Noto Serif JP',serif; font-size:15px; font-weight:500; color:var(--ink); display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .rdot { width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .review-empty { text-align:center; padding:20px; color:var(--ink-faint); font-size:12px; }
  .review-list { list-style:none; }
  .ritem { display:flex; align-items:center; gap:10px; padding:9px 8px; border-bottom:1px solid var(--border); cursor:pointer; border-radius:4px; margin:0 -8px; transition:background 0.1s; }
  .ritem:last-child { border-bottom:none; }
  .ritem:hover { background:var(--accent-pale); }
  .rurg { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .uh { background:var(--red); } .um { background:var(--amber); } .ul { background:var(--green); }
  .rname { flex:1; font-size:13px; }
  .rcat { font-size:11px; color:var(--ink-faint); font-family:'DM Mono',monospace; }
  .rdays { font-size:11px; color:var(--ink-faint); font-family:'DM Mono',monospace; white-space:nowrap; }
  .sec-label { font-family:'Noto Serif JP',serif; font-size:14px; font-weight:500; color:var(--ink); margin-bottom:12px; }
  .cat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .cat-card { background:var(--paper-card); border:1px solid var(--border); border-radius:8px; padding:14px 16px; cursor:pointer; transition:all 0.15s; }
  .cat-card:hover { border-color:var(--accent-light); background:var(--accent-pale); transform:translateY(-1px); box-shadow:0 4px 12px var(--shadow); }
  .cc-roman { font-family:'DM Mono',monospace; font-size:11px; color:var(--accent-light); margin-bottom:4px; }
  .cc-name { font-size:12px; font-weight:500; color:var(--ink); line-height:1.4; margin-bottom:8px; }
  .cc-bar { height:3px; background:var(--border); border-radius:2px; overflow:hidden; margin-bottom:6px; }
  .cc-fill { height:100%; background:var(--accent-light); border-radius:2px; }
  .cc-stats { font-size:10px; color:var(--ink-faint); font-family:'DM Mono',monospace; }
  /* CAT PAGE */
  .page-header { margin-bottom:24px; }
  .page-roman { font-family:'DM Mono',monospace; font-size:12px; color:var(--accent-light); margin-bottom:4px; }
  .page-title { font-family:'Noto Serif JP',serif; font-size:22px; font-weight:500; color:var(--ink); }
  .major-list { display:flex; flex-direction:column; gap:8px; }
  .major-item { background:var(--paper-card); border:1px solid var(--border); border-radius:8px; padding:16px 20px; cursor:pointer; transition:all 0.15s; display:flex; align-items:center; gap:14px; }
  .major-item:hover { border-color:var(--accent-light); background:var(--accent-pale); }
  .mi-num { font-family:'DM Mono',monospace; font-size:12px; color:var(--accent-light); min-width:20px; flex-shrink:0; }
  .mi-name { font-size:14px; color:var(--ink); flex:1; }
  .mi-count { font-size:11px; color:var(--ink-faint); font-family:'DM Mono',monospace; }
  .mi-arrow { color:var(--ink-faint); font-size:16px; }
  /* MAJOR PAGE */
  .disease-grid { display:flex; flex-wrap:wrap; gap:8px; }
  .dchip { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:20px; border:1px solid var(--border); background:var(--paper-card); font-size:12px; color:var(--ink-light); cursor:pointer; transition:all 0.15s; position:relative; }
  .dchip:hover { border-color:var(--accent-light); background:var(--accent-pale); color:var(--accent); }
  .dchip.has-content { border-color:var(--accent-light); background:var(--accent-pale); color:var(--accent); }
  .dchip.due { border-color:var(--red); }
  .chip-dot { width:5px; height:5px; border-radius:50%; background:currentColor; opacity:0.6; }
  .chip-badge { width:6px; height:6px; border-radius:50%; background:var(--red); position:absolute; top:-2px; right:-2px; }
  /* DISEASE PAGE */
  .dis-header { margin-bottom:24px; }
  .dis-bc { font-size:11px; color:var(--ink-faint); font-family:'DM Mono',monospace; margin-bottom:6px; }
  .dis-title { font-family:'Noto Serif JP',serif; font-size:24px; font-weight:500; color:var(--ink); margin-bottom:8px; }
  .dis-meta { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .dis-last { font-size:11px; color:var(--ink-faint); font-family:'DM Mono',monospace; }
  .dis-next { font-size:11px; padding:2px 10px; border-radius:20px; font-family:'DM Mono',monospace; }
  .nsoon { background:var(--red-pale); color:var(--red); }
  .nmid { background:var(--amber-pale); color:var(--amber); }
  .nfar { background:var(--green-pale); color:var(--green); }
  .content-empty { background:var(--paper-warm); border:2px dashed var(--border); border-radius:8px; padding:36px; text-align:center; color:var(--ink-faint); margin-bottom:20px; }
  .content-empty h3 { font-size:14px; margin-bottom:8px; font-weight:500; }
  .content-empty p { font-size:12px; line-height:1.7; }
  .content-empty code { font-family:'DM Mono',monospace; background:var(--paper-card); padding:2px 6px; border-radius:3px; font-size:11px; color:var(--accent); }
  .fold { border:1px solid var(--border); border-radius:8px; margin-bottom:10px; overflow:hidden; background:var(--paper-card); }
  .fold-hd { display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer; user-select:none; transition:background 0.12s; }
  .fold-hd:hover { background:var(--paper-warm); }
  .fold-icon { width:22px; height:22px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }
  .fold-lbl { font-size:13px; font-weight:500; color:var(--ink); flex:1; }
  .fold-st { font-size:10px; font-family:'DM Mono',monospace; color:var(--ink-faint); }
  .fold-bd { padding:0 16px; max-height:0; overflow:hidden; transition:max-height 0.3s ease, padding 0.3s ease; }
  .fold-bd.open { padding:0 16px 16px; max-height:2000px; }
  .mask { position:relative; }
  .mask.on::after { content:''; position:absolute; inset:0; background:var(--ink); border-radius:4px; cursor:pointer; }
  .mask.on .mask-hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:1; color:#fff; font-size:12px; cursor:pointer; gap:6px; }
  .mask:not(.on) .mask-hint { display:none; }
  .fold-content { padding:10px 0; font-size:13px; color:var(--ink-light); line-height:1.85; }
  .fold-content h4 { font-family:'Noto Serif JP',serif; font-size:13px; font-weight:700; color:var(--ink); margin:10px 0 5px; }
  .fold-content h4:first-child { margin-top:0; }
  .fold-content ul { padding-left:18px; margin:4px 0; }
  .fold-content li { margin:2px 0; }
  .tag { display:inline-block; padding:1px 8px; border-radius:3px; font-size:11px; margin:2px; font-weight:500; }
  .tr { background:var(--red-pale); color:var(--red); }
  .ta { background:var(--amber-pale); color:var(--amber); }
  .tg { background:var(--green-pale); color:var(--green); }
  .toggle-btn { font-size:11px; padding:3px 10px; border-radius:20px; border:1px solid var(--border); background:var(--paper); color:var(--ink-light); cursor:pointer; font-family:'Noto Sans JP',sans-serif; transition:all 0.12s; margin-top:8px; }
  .toggle-btn:hover { background:var(--accent-pale); border-color:var(--accent-light); color:var(--accent); }
  .eval-sec { background:var(--paper-card); border:1px solid var(--border); border-radius:8px; padding:22px; margin-top:24px; text-align:center; }
  .eval-sec h3 { font-family:'Noto Serif JP',serif; font-size:14px; font-weight:500; color:var(--ink); margin-bottom:5px; }
  .eval-sec p { font-size:11px; color:var(--ink-faint); margin-bottom:18px; }
  .eval-btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .ebtn { display:flex; flex-direction:column; align-items:center; gap:3px; padding:12px 20px; border-radius:8px; border:2px solid transparent; cursor:pointer; font-family:'Noto Sans JP',sans-serif; transition:all 0.15s; background:var(--paper); min-width:100px; }
  .ei { font-size:20px; } .el { font-size:12px; font-weight:500; color:var(--ink); } .es { font-size:10px; color:var(--ink-faint); }
  .ebtn.good { border-color:var(--green); background:var(--green-pale); }
  .ebtn.good:hover { background:#b7e4c7; }
  .ebtn.mid { border-color:var(--amber); background:var(--amber-pale); }
  .ebtn.mid:hover { background:#fce8c8; }
  .ebtn.bad { border-color:var(--red); background:var(--red-pale); }
  .ebtn.bad:hover { background:#f9c8d0; }
  .eval-result { display:none; margin-top:14px; padding:10px 18px; border-radius:6px; font-size:12px; font-family:'DM Mono',monospace; }
  .eval-result.show { display:block; }
  .hrow { display:flex; gap:5px; flex-wrap:wrap; margin-top:8px; justify-content:center; }
  .hdot { width:10px; height:10px; border-radius:50%; }
  .hg { background:var(--green); } .hm { background:var(--amber); } .hb { background:var(--red); }

  /* ── サイドバー開閉 ── */
  #sidebar-toggle { display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:6px; border:1px solid var(--border); background:var(--paper-card); color:var(--ink-light); cursor:pointer; flex-shrink:0; font-size:16px; line-height:1; transition:background 0.15s; }
  #sidebar-toggle:hover { background:var(--accent-pale); color:var(--accent); }

  /* サイドバーが閉じた状態 */
  #sidebar.collapsed { transform:translateX(-240px); }
  #main.expanded { margin-left:0; }
  #sidebar { transition:transform 0.25s ease; }
  #main { transition:margin-left 0.25s ease; }

  /* オーバーレイ（スマホ用） */
  #sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:99; }
  #sidebar-overlay.show { display:block; }

  /* ── スマホ対応 ── */
  @media (max-width:640px) {
    #sidebar { transform:translateX(-240px); }
    #sidebar.open { transform:translateX(0); }
    #main { margin-left:0 !important; }
    .page { padding:20px 16px; }
    .home-grid { grid-template-columns:1fr 1fr; gap:10px; }
    .cat-grid { grid-template-columns:1fr 1fr; }
    #topnav { padding:0 14px; gap:8px; }
    .home-title { font-size:18px; }
    .dis-title { font-size:20px; }
    .eval-btns { gap:8px; }
    .ebtn { min-width:80px; padding:10px 12px; }
  }
  @media (max-width:400px) {
    .cat-grid { grid-template-columns:1fr; }
    .home-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="sidebar-overlay" onclick="closeSidebar()"></div>
<div id="app">
  <nav id="sidebar">
    <div id="sidebar-header" onclick="showHome()">
      <h1>WJ Medical Learning</h1>
      <p>MEDICAL LEARNING SYSTEM</p>
    </div>
    <div class="sb-label">カテゴリ</div>
    <div id="sidebar-nav"></div>
  </nav>
  <div id="main">
    <div id="topnav">
      <button id="sidebar-toggle" onclick="toggleSidebar()" title="メニュー">☰</button>
      <button id="nav-home-btn" onclick="showHome()">🏠 ホーム</button>
      <div id="breadcrumb"><span>ホーム</span></div>
    </div>
    <!-- HOME -->
    <div class="page active" id="page-home">
      <div class="home-title">WJ Medical Learning</div>
      <div class="home-date" id="home-date"></div>
      <div class="home-grid">
        <div class="home-card"><div class="home-card-title">学習済み疾患</div><div class="home-stat" id="stat-studied">0</div><div class="home-stat-sub">疾患にコンテンツあり</div></div>
        <div class="home-card"><div class="home-card-title">本日の復習</div><div class="home-stat" id="stat-due">0</div><div class="home-stat-sub">疾患が期限を迎えています</div></div>
      </div>
      <div class="review-section">
        <div class="review-title"><div class="rdot"></div>今日復習すべき疾患</div>
        <div id="review-list-container"></div>
      </div>
      <div class="sec-label">カテゴリ一覧</div>
      <div class="cat-grid" id="cat-grid"></div>
    </div>
    <!-- CATEGORY PAGE (大項目一覧) -->
    <div class="page" id="page-cat">
      <div class="page-header">
        <div class="page-roman" id="cat-roman"></div>
        <div class="page-title" id="cat-title"></div>
      </div>
      <div class="major-list" id="cat-body"></div>
    </div>
    <!-- MAJOR PAGE (疾患チップ) -->
    <div class="page" id="page-major">
      <div class="page-header">
        <div class="page-roman" id="major-roman"></div>
        <div class="page-title" id="major-title"></div>
      </div>
      <div class="disease-grid" id="major-body"></div>
    </div>
    <!-- DISEASE PAGE -->
    <div class="page" id="page-disease">
      <div class="dis-header">
        <div class="dis-bc" id="dis-bc"></div>
        <div class="dis-title" id="dis-title"></div>
        <div class="dis-meta">
          <div class="dis-last" id="dis-last"></div>
          <div class="dis-next" id="dis-next"></div>
        </div>
      </div>
      <div id="dis-content"></div>
      <div class="eval-sec">
        <h3>自己評価</h3>
        <p>内容を確認したら、どの程度思い出せたか記録してください</p>
        <div class="eval-btns">
          <button class="ebtn good" onclick="evaluate('good')"><span class="ei">✓</span><span class="el">思い出せた</span><span class="es">次回: 間隔を空ける</span></button>
          <button class="ebtn mid" onclick="evaluate('mid')"><span class="ei">△</span><span class="el">あいまい</span><span class="es">次回: 数日後</span></button>
          <button class="ebtn bad" onclick="evaluate('bad')"><span class="ei">✗</span><span class="el">思い出せなかった</span><span class="es">次回: 明日</span></button>
        </div>
        <div class="eval-result" id="eval-result"></div>
        <div style="margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;">
          <span style="font-size:11px;color:var(--ink-faint)">過去の評価:</span>
          <div class="hrow" id="hrow"></div>
        </div>
      </div>
    </div>
  </div>

<script>

DISEASE_CONTENT[dk('V','V-5','急性冠症候群（STEMI・NSTEMI・不安定狭心症）')]={sections:[{label:'概念・定義',html:'<h4>定義</h4><p>冠動脈プラーク破綻→血栓形成による急性心筋虚血の総称。STEMI・NSTEMI・不安定狭心症を含む。</p>'},{label:'症状',html:'<h4>典型症状</h4><ul><li>胸骨下の締め付け感（20分以上）</li><li>左肩・左腕・顎への放散痛</li><li>冷汗、呼吸困難、嘔気</li></ul><h4>非典型例</h4><ul><li>糖尿病患者：無痛性</li><li>高齢者・女性：倦怠感・息切れのみ</li></ul>'},{label:'診断',html:'<h4>12誘導心電図</h4><ul><li><span class="tag tr">STEMI</span> ST上昇 ≥0.1mV</li></ul><h4>心筋バイオマーカー</h4><ul><li><span class="tag tr">Troponin I/T</span> 最も特異的（3〜6h後上昇）</li><li>CK-MB：4〜6h上昇、24hピーク</li></ul>'},{label:'治療',html:'<h4>急性期（STEMI）— Door to Balloon ≤90分</h4><ul><li><span class="tag tr">緊急PCI</span> 第一選択</li><li>アスピリン + P2Y12阻害薬（DAPT）</li><li>ヘパリン（抗凝固）</li></ul><h4>二次予防</h4><ul><li>スタチン、β遮断薬、ACE阻害薬/ARB</li><li>DAPT 12ヶ月継続</li></ul>'},{label:'合併症',html:'<ul><li><span class="tag tr">心室細動</span> 発症後24h以内 → 除細動</li><li><span class="tag tr">心原性ショック</span> Killip IV</li><li>乳頭筋断裂 → 急性MR</li><li>心室中隔穿孔（VSP）</li><li>Dressler症候群（2〜10週後）</li></ul>'}]};

function dk(catId,majorId,disease){return catId+'_'+majorId+'_'+disease.replace(/[^\w\u3040-\u9fff]/g,'_');}

function getIntervalDays(r,c){if(r==='good'){if(c<2)return 3;if(c<5)return 7;if(c<10)return 14;if(c<20)return 30;return Math.round(c*1.8);}else if(r==='mid'){if(c<3)return 3;return Math.min(Math.round(c*0.6),5);}return 1;}
function tod(){return new Date().toISOString().slice(0,10);}
function diff(ds){const t=new Date();t.setHours(0,0,0,0);const d=new Date(ds);d.setHours(0,0,0,0);return Math.round((t-d)/86400000);}
function gsd(id){const r=localStorage.getItem('study_'+id);return r?JSON.parse(r):{lastStudied:null,nextReview:null,interval:1,history:[]};}
function ssd(id,data){localStorage.setItem('study_'+id,JSON.stringify(data));}

function getDue(){const t=tod();const due=[];CATEGORIES.forEach(cat=>cat.majors.forEach(major=>major.diseases.forEach(dis=>{const id=dk(cat.id,major.id,dis);const d=gsd(id);if(d.lastStudied&&d.nextReview&&d.nextReview<=t)due.push({id,disease:dis,catRoman:cat.roman,nextReview:d.nextReview,cat,major});})));due.sort((a,b)=>a.nextReview.localeCompare(b.nextReview));return due.slice(0,10);}

let curDiseaseId=null;
function sp(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+id).classList.add('active');}
function showHome(){sp('home');document.getElementById('breadcrumb').innerHTML='<span>ホーム</span>';renderHome();document.querySelectorAll('.sb-cat').forEach(e=>e.classList.remove('active'));}
function showCat(cat){document.getElementById('cat-roman').textContent=cat.roman+'.';document.getElementById('cat-title').textContent=cat.name;document.getElementById('breadcrumb').innerHTML='<span>'+cat.roman+'. '+cat.name+'</span>';renderCatBody(cat);sp('cat');document.querySelectorAll('.sb-cat').forEach(e=>e.classList.remove('active'));const sb=document.querySelector('[data-catid="'+cat.id+'"]');if(sb)sb.classList.add('active');}
function showMajor(cat,major){document.getElementById('major-roman').textContent=cat.roman+' › '+major.num+'.';document.getElementById('major-title').textContent=major.name;document.getElementById('breadcrumb').innerHTML='<span>'+cat.roman+' › '+major.name+'</span>';renderMajorBody(cat,major);sp('major');}
function showDisease(cat,major,disease){curDiseaseId=dk(cat.id,major.id,disease);document.getElementById('dis-bc').textContent=cat.roman+' › '+major.name;document.getElementById('dis-title').textContent=disease;document.getElementById('breadcrumb').innerHTML='<span>'+disease+'</span>';renderDiseasePage(cat,major,disease);sp('disease');}

function renderHome(){
  const d=new Date();
  document.getElementById('home-date').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+['日','月','火','水','木','金','土'][d.getDay()]+'曜日';
  let s=0;CATEGORIES.forEach(cat=>cat.majors.forEach(m=>m.diseases.forEach(dis=>{if(gsd(dk(cat.id,m.id,dis)).lastStudied)s++;})));
  const due=getDue();
  document.getElementById('stat-studied').textContent=s;
  document.getElementById('stat-due').textContent=due.length;
  const c=document.getElementById('review-list-container');
  if(due.length===0){c.innerHTML='<div class="review-empty">🎉 今日の復習はありません。新しい疾患を学習しましょう！</div>';}
  else{const ul=document.createElement('ul');ul.className='review-list';due.forEach(item=>{const o=diff(item.nextReview);const ug=o>=3?'h':o>=1?'m':'l';const li=document.createElement('li');li.className='ritem';li.innerHTML='<div class="rurg u'+ug+'"></div><div class="rname">'+item.disease+'</div><div class="rcat">'+item.catRoman+'</div><div class="rdays">'+(o>0?o+'日超過':'本日')+'</div>';li.onclick=()=>showDisease(item.cat,item.major,item.disease);ul.appendChild(li);});c.innerHTML='';c.appendChild(ul);}
  const g=document.getElementById('cat-grid');g.innerHTML='';
  CATEGORIES.forEach(cat=>{let tot=0,st=0;cat.majors.forEach(m=>m.diseases.forEach(dis=>{tot++;if(gsd(dk(cat.id,m.id,dis)).lastStudied)st++;}));const pct=tot>0?Math.round(st/tot*100):0;const card=document.createElement('div');card.className='cat-card';card.innerHTML='<div class="cc-roman">'+cat.roman+'</div><div class="cc-name">'+cat.name+'</div><div class="cc-bar"><div class="cc-fill" style="width:'+pct+'%"></div></div><div class="cc-stats">'+st+'/'+tot+' 学習済</div>';card.onclick=()=>showCat(cat);g.appendChild(card);});
}

function renderCatBody(cat){
  const body=document.getElementById('cat-body');body.innerHTML='';const t=tod();
  cat.majors.forEach(major=>{let due=0;major.diseases.forEach(dis=>{const d=gsd(dk(cat.id,major.id,dis));if(d.nextReview&&d.nextReview<=t)due++;});
    const item=document.createElement('div');item.className='major-item';
    item.innerHTML='<div class="mi-num">'+major.num+'</div><div class="mi-name">'+major.name+'</div><div class="mi-count">'+major.diseases.length+' 疾患'+(due>0?' <span style="color:var(--red);font-size:11px">●'+due+'要復習</span>':'')+'</div><div class="mi-arrow">›</div>';
    item.onclick=()=>showMajor(cat,major);body.appendChild(item);});
}

function renderMajorBody(cat,major){
  const body=document.getElementById('major-body');body.innerHTML='';const t=tod();
  major.diseases.forEach(disease=>{const id=dk(cat.id,major.id,disease);const data=gsd(id);const hc=!!DISEASE_CONTENT[id];const dr=data.nextReview&&data.nextReview<=t;
    const chip=document.createElement('div');chip.className='dchip'+(hc?' has-content':'')+(dr?' due':'');
    chip.innerHTML=(hc?'<span class="chip-dot"></span>':'')+disease+(dr?'<span class="chip-badge"></span>':'');
    chip.onclick=()=>showDisease(cat,major,disease);body.appendChild(chip);});
}

function renderDiseasePage(cat,major,disease){
  const id=curDiseaseId;const data=gsd(id);
  if(data.lastStudied){const days=diff(data.lastStudied);document.getElementById('dis-last').textContent='最終学習: '+(days===0?'今日':days+'日前');const nr=document.getElementById('dis-next');if(data.nextReview){const dtr=-diff(data.nextReview);if(dtr<=0){nr.textContent='🔴 復習期限超過';nr.className='dis-next nsoon';}else if(dtr<=3){nr.textContent='🟡 '+dtr+'日後に復習';nr.className='dis-next nmid';}else{nr.textContent='🟢 '+dtr+'日後に復習';nr.className='dis-next nfar';}}}else{document.getElementById('dis-last').textContent='未学習';document.getElementById('dis-next').textContent='';document.getElementById('dis-next').className='dis-next';}
  const area=document.getElementById('dis-content');const content=DISEASE_CONTENT[id];
  if(!content){area.innerHTML='<div class="content-empty"><h3>📄 まだコンテンツがありません</h3><p>Claudeで疾患PDFを整理し、以下のキーで追加してください：<br><code>'+id+'</code></p></div>';}
  else{area.innerHTML='';const icons={'概念・定義':'📖','病態生理':'🔬','症状':'🩺','診断':'🔍','治療':'💊','合併症':'⚠️','予後':'📊'};const bgs={'概念・定義':'#dbe9f9','病態生理':'#fde8ec','症状':'#d8f3dc','診断':'#fef3e2','治療':'#fde8ec','合併症':'#fef3e2','予後':'#d8f3dc'};content.sections.forEach((sec,i)=>{const fold=document.createElement('div');fold.className='fold';const icon=icons[sec.label]||'📝';const bg=bgs[sec.label]||'#f0e4d8';fold.innerHTML='<div class="fold-hd" id="fh'+i+'" onclick="tf('+i+')"><div class="fold-icon" style="background:'+bg+'">'+icon+'</div><div class="fold-lbl">'+sec.label+'</div><div class="fold-st" id="fs'+i+'">▶ 表示する</div></div><div class="fold-bd" id="fb'+i+'"><div class="mask on" id="fm'+i+'"><div class="fold-content">'+sec.html+'</div><div class="mask-hint" onclick="rs('+i+')">👁 クリックして内容を表示</div></div><div style="text-align:right"><button class="toggle-btn" id="ftb'+i+'" onclick="rs('+i+')">内容を表示する</button></div></div>';area.appendChild(fold);});}
  const hr=document.getElementById('hrow');hr.innerHTML='';const hist=(data.history||[]).slice(-20);if(hist.length===0){hr.innerHTML='<span style="font-size:11px;color:var(--ink-faint)">まだ評価履歴がありません</span>';}else{hist.forEach(h=>{const dot=document.createElement('div');dot.className='hdot h'+h.rating[0];dot.title=h.date+': '+(h.rating==='good'?'思い出せた':h.rating==='mid'?'あいまい':'思い出せなかった');hr.appendChild(dot);});}
  document.getElementById('eval-result').classList.remove('show');
}

function tf(i){const b=document.getElementById('fb'+i);const s=document.getElementById('fs'+i);const o=b.classList.contains('open');b.classList.toggle('open');s.textContent=o?'▶ 表示する':'▼ 非表示にする';if(!o){const m=document.getElementById('fm'+i);if(m)m.classList.add('on');const btn=document.getElementById('ftb'+i);if(btn){btn.textContent='内容を表示する';btn.onclick=()=>rs(i);}}}
function rs(i){const m=document.getElementById('fm'+i);const btn=document.getElementById('ftb'+i);if(m)m.classList.remove('on');if(btn){btn.textContent='再び隠す';btn.onclick=()=>hs(i);}}
function hs(i){const m=document.getElementById('fm'+i);const btn=document.getElementById('ftb'+i);if(m)m.classList.add('on');if(btn){btn.textContent='内容を表示する';btn.onclick=()=>rs(i);}}

function evaluate(rating){
  if(!curDiseaseId)return;const data=gsd(curDiseaseId);const today=tod();const ni=getIntervalDays(rating,data.interval||1);const nd=new Date();nd.setDate(nd.getDate()+ni);const ns=nd.toISOString().slice(0,10);
  data.lastStudied=today;data.interval=ni;data.nextReview=ns;data.history=data.history||[];data.history.push({date:today,rating});ssd(curDiseaseId,data);
  const msgs={good:{msg:'✓ 次の復習は '+ni+'日後（'+ns+'）です。',bg:'var(--green-pale)',color:'var(--green)'},mid:{msg:'△ 次の復習は '+ni+'日後（'+ns+'）です。',bg:'var(--amber-pale)',color:'var(--amber)'},bad:{msg:'✗ 明日（'+ns+'）にまた復習しましょう。',bg:'var(--red-pale)',color:'var(--red)'}};
  const m=msgs[rating];const res=document.getElementById('eval-result');res.style.background=m.bg;res.style.color=m.color;res.textContent=m.msg;res.classList.add('show');
  document.getElementById('dis-last').textContent='最終学習: 今日';const nr=document.getElementById('dis-next');nr.textContent=(ni<=1?'🔴':ni<=3?'🟡':'🟢')+' '+ni+'日後に復習';nr.className='dis-next '+(ni<=1?'nsoon':ni<=3?'nmid':'nfar');
  const hr=document.getElementById('hrow');hr.innerHTML='';(data.history||[]).slice(-20).forEach(h=>{const dot=document.createElement('div');dot.className='hdot h'+h.rating[0];hr.appendChild(dot);});
}

function renderSidebar(){const nav=document.getElementById('sidebar-nav');nav.innerHTML='';CATEGORIES.forEach(cat=>{const item=document.createElement('div');item.className='sb-cat';item.setAttribute('data-catid',cat.id);item.innerHTML='<span class="sb-cat-num">'+cat.roman+'</span><span>'+cat.name+'</span>';item.onclick=()=>showCat(cat);nav.appendChild(item);});}

renderSidebar();renderHome();

// ── サイドバー開閉 ──
const isMobile = () => window.innerWidth <= 640;
function toggleSidebar(){
  if(isMobile()){
    const open = document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('show', open);
  } else {
    const collapsed = document.getElementById('sidebar').classList.toggle('collapsed');
    document.getElementById('main').classList.toggle('expanded', collapsed);
  }
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
}
// スマホでカテゴリ選択後にサイドバーを閉じる
const _origShowCat = showCat;
showCat = function(cat){ _origShowCat(cat); if(isMobile()) closeSidebar(); };

</script>
